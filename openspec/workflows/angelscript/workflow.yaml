name: angelscript
version: 1
description: Lightweight AngelscriptProject records for refactors, documentation, maintenance, and changes that do not require specification deltas
artifacts:
- id: proposal
  generates: proposal.md
  description: Motivation, outcomes, boundaries, and impact
  template: proposal.md
  required: true
  instruction: |
    Write this record in English. Explain the current problem, expected outcome, scope, and non-goals.
    Identify affected repositories, submodules, modules, and user entry points. Keep depth proportional
    to risk; a small documentation or maintenance change may remain concise.
  requires: []
  context: []
- id: specs
  generates: specs/**/*.md
  description: Optional durable behavior or capability records
  template: spec.md
  required: false
  instruction: |
    Write this record in English and only when the change adds or modifies behavior worth preserving.
    Write Requirements as durable externally observable SHALL behavior and use the Scenario Card
    contract in .agents/skills/openspec/references/specs.md. Every ordinary scenario keeps a clear
    `WHEN` and `THEN`. Actively evaluate every new or modified `GIVEN`, `WHEN`, `THEN`, `AND`, or
    `BUT`, and supply useful quoted notes, prose, ordered or unordered lists,
    examples, and tables in a clause-owned detail block immediately beneath the exact clause. Even simple clauses
    receive this evaluation. Direct detail uses four spaces and blank-line block separation. Include concrete
    inputs, identities, outputs, failure-state and lifetime constraints when they settle behavior. Detail may
    be extensive. Every form remains optional: omit it when it adds no durable information, never to
    satisfy a compact-first habit, and never disguise implementation steps, Task state, or transient evidence as behavior.
  requires: []
  context:
  - proposal
  - design
- id: design
  generates: design.md
  description: Optional technical decisions and trade-offs
  template: design.md
  required: false
  instruction: |
    Write this record in English when architecture, compatibility, migration, risk, or a non-obvious
    trade-off requires explanation. Focus on decisions and reasons, state plugin/host/submodule
    ownership boundaries, and do not duplicate the task list.
  requires: []
  context:
  - proposal
  - specs
- id: tasks
  generates: tasks.md
  description: Required implementation, dependency, and verification plan
  template: tasks.md
  required: true
  instruction: |
    Write this record in English. Put the sole dependency graph in top-of-file YAML frontmatter under
    task_graph.version 1 and depends_on. Quote every permanent X.Y task id, map every top-level task
    exactly once, and use [] for roots. Use a short checkbox title and four-space owned Markdown.
    Require one direct **Files** path list and one direct **Verification** section containing exactly
    one fenced proving command; no old inline or blockquote metadata is supported. Use
    ordered lists for nested execution steps. Markdown order is presentation-only. Derive parallelism
    from completed dependencies and disjoint files, artifacts, and resource leases; do not create a
    second graph, status store, or runtime database.
    Read .agents/skills/openspec/references/tasks.md before authoring: each node is a bounded,
    independently testable feature outcome, not a test launch or an open-ended subsystem. State
    concrete test inputs/results and expected RED, consumed/produced interfaces, implementation order
    and completion conditions. Default to Outcome, Context and interfaces, Cases, Implementation,
    Files and Verification; add Evidence only after execution. Include relevant identity, lifetime,
    ownership and failure-state contracts. Useful detail may be extensive. Keep related tests and implementation together;
    use optional prose, quotes, lists or examples rather than rigid fields. Keep Files aligned with the
    real scope. Use .agents/skills/harness/references/verification.md for grouped RED/GREEN and exact
    task-to-case evidence when compatible tasks share an expensive run. Do not size tasks by quotas.
  requires: []
  context:
  - proposal
  - specs
  - design
apply:
  requires:
  - tasks
  tracks: tasks.md
  instruction: |
    Use the existing English records and project-local prompt configuration as context, preserve
    unrelated workspace changes, and update task state only after its verification succeeds.
    Before implementation, check the task's bounded outcome, concrete cases, expected RED, interfaces
    and proving selection against .agents/skills/openspec/references/tasks.md. Use feature-group
    RED/GREEN and shared evidence through .agents/skills/harness/references/verification.md; an
    oversized or unprovable task needs a boundary correction, not unlimited tail-prose expansion.
archive:
  requires:
  - proposal
  - tasks
  tracks: null
  instruction: |
    Preserve the change directory as English history. Before archive, confirm every task is complete
    and decide whether durable behavior belongs in the current specification tree.
validation:
  profile: record-v1
