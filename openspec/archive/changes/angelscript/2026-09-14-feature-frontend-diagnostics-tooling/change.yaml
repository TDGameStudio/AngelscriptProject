  id: angelscript/feature-frontend-diagnostics-tooling
  title: Clang-style frontend diagnostics and native semantic tooling
  description: Upgrade every current native frontend diagnostic path, implement reusable completion, signature help, hover and definition queries, and expose an in-process SDK language service for compile-time diagnostic formatting and suggestion query without an LSP transport or legacy runtime activation.
workflow: angelscript
created_at: 2026-09-05T13:52:52Z
goal: Provide rich source-accurate diagnostics, engine-independent semantic queries, and an in-process SDK facade so compilation failures can format Clang-style suggestions and inspect notes/fixes without a language-server process.
