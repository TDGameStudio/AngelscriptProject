  id: angelscript/feature-delegates-ue-interop
  title: UE-style delegate declarations, native callables, and Unreal interoperability
  description: Replace AngelScript delegate/event keywords with the six UE DECLARE_* families (60 spellings), execute Bind/Execute/Broadcast on the replacement host, then materialize native adapters, UDelegateFunction, Blueprint, and cooked load. Implementation is authorized; 1.1 remains the planning-validation gate.
