workflow: angelscript
context: |
  Language: English. All maintained OpenSpec records, manifests, workflows, templates, and attachments are written in English.
  Keep structural headings and the normative keywords SHALL/MUST in English. Files explicitly named with _ZH are the only temporary localization exception among maintained records; new brainstorming draft materials under openspec/drafts/ default to the user's conversation language unless explicitly specified otherwise, including design.md and handoff.md; log.md preserves original wording. Every final Change record and attachment, including exported draft material and diagram explanations, remains English.
  AngelscriptProject is an Unreal Engine 5.8 host repository whose primary deliverable is Plugins/Angelscript.
  Keep Source/AngelscriptProject minimal; plugin behavior belongs in the owning plugin or extension.
  Plugins/Angelscript, Plugins/AngelscriptGameplayTags, Plugins/AngelscriptGAS, and Tools/openspec are independent Git submodules. Source changes land in the owning submodule before the parent gitlink is updated.
  The repository may contain unrelated work from an ongoing large refactor. Inspect the current tree and preserve unrelated user changes.
  Use one explicit or current-directory-discovered WorkspaceRoot for every operation. Unattended continuation is defined once in .agents/skills/harness/SKILL.md; it continues only approved Ready tasks and never asks the user.
  Root Tools PowerShell entry points are legacy deletion candidates and are not the live Harness route. Tools/openspec remains the tracked Rust source submodule; normal runtime uses .agents/skills/openspec/bin/openspec.exe.
rules:
  proposal:
    - State the current problem, intended outcome, scope, explicit non-goals, and affected ownership boundaries.
    - Identify whether the work changes a submodule, the parent project, or both.
  specs:
    - Record durable externally observable behavior rather than implementation steps.
    - For durable specification deltas, put each delta at specs/<capability-id>/spec.md and use ADDED, MODIFIED, REMOVED, or RENAMED Requirements sections.
    - Follow .agents/skills/openspec/references/specs.md. Keep a clear WHEN and THEN; actively evaluate every new or modified GIVEN, WHEN, THEN, AND, or BUT and supply useful quoted notes, prose, ordered or unordered lists, examples, and tables in a four-space clause-owned detail block beneath its exact clause. Useful detail may be extensive, including concrete identities, lifetime and failure-state constraints. Every form remains optional and may be omitted when it adds no durable information.
    - Scenario Card detail uses the Task-like list-item composition shape but remains ordinary Markdown with no Task state, parser fields, or rigid field matrix. Ordered lists describe durable behavior order or rule precedence, not implementation execution. In MODIFIED, a same-name scenario supplies the complete replacement card with every block retained beneath its exact owning clause, while unspecified scenarios remain unchanged.
  design:
    - Separate decisions and rationale from implementation detail; record alternatives only when they materially affect the choice.
    - Call out compatibility, migration, module boundaries, failure modes, and rollback when relevant.
  tasks:
    - Treat each level-2 heading "## [ ] X.Y Title" as one permanent DAG node whose unindented body runs to the next "##"; group headings without a checkbox own nothing, and root checkbox list items are a retired format.
    - Keep the sole dependency graph in top-of-file task_graph.version 1 frontmatter; depends_on maps each quoted task ID to quoted direct prerequisites and uses [] for roots.
    - The Graph key set must exactly match the task heading IDs. Markdown order is presentation-only. Require one direct **Files** paragraph followed by one ```diff tree (+ create, space modify, - delete, /-terminated directory prefixes) and one direct **Verification** section with one fenced proving command. No old inline or list metadata is supported.
    - Read .agents/skills/openspec/references/tasks.md. Open with # title, ## Goal, ## Architecture, ## Global constraints (linking execution-conventions.md), optional ## File map and ## Requirement coverage with a self-review line. A behavior card carries a brief paragraph, Outcome, Interfaces (signatures in code fences, new names with their source), Cases (one header line "N. **Name** — role · kind" per case, standard roles or words defined in Roles:/Kinds:, at least one new RED; body shapes per .agents/skills/openspec/references/cases.md), Files, Verification, optional Notes; add Evidence only after execution. Document or migration cards omit Interfaces and Cases. No step-level TDD scripts, no forbidden placeholder phrases, no size quotas.
    - Never reuse task IDs, uncheck completed tasks, mix live After fields with frontmatter, or maintain a second graph or status store. Derive parallel work only after checking file, artifact, and resource-lease conflicts.
  apply:
    - Update checkbox state only after the associated work and stated verification have actually completed.
operations:
  apply:
    - Preserve unrelated dirty-worktree changes and keep plugin logic in the owning plugin.
    - Investigate and resolve in-scope failures autonomously in the selected workspace; stop only at a real authorization boundary. Unattended continuation does not change this policy.
    - Import Harness once and route build, test, and OpenSpec commands through Invoke-Harness, selecting the smallest relevant verification scope first.
  archive:
    - Use completed closure only after every task and verification passes, durable specs and attachments are ready, and every explicitly requested Review is closed or superseded. Do not create an automatic Final Review or a not-required placeholder; abandoned or superseded closure requires reasons and incomplete-task dispositions.
    - Sync durable behavior into openspec/specs or explicitly record why sync is not applicable before preserving history.
