name: Share an Archify diagram
description: Submit a real, reproducible diagram for the community showcase.
title: "[Showcase]: "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing real-world proof. Please attach enough evidence for maintainers to reproduce and validate the result. Redact private repository details before submitting.

  - type: dropdown
    id: diagram_type
    attributes:
      label: Diagram type
      options:
        - Architecture
        - Workflow
        - Sequence
        - Data flow
        - Lifecycle
    validations:
      required: true

  - type: input
    id: archify_version
    attributes:
      label: Archify version or commit
      description: Use an exact package version or full repository commit when possible.
      placeholder: "2.12.0 or 0123456789abcdef..."
    validations:
      required: true

  - type: input
    id: agent
    attributes:
      label: Agent or coding client
      placeholder: "Codex, Claude Code, Cursor, opencode..."
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Model
      placeholder: "Provider and exact model name"
    validations:
      required: true

  - type: textarea
    id: prompt
    attributes:
      label: Original prompt
      description: Share the first prompt used to request this diagram. Redact repository or customer identifiers if needed.
      render: text
    validations:
      required: true

  - type: textarea
    id: source_json
    attributes:
      label: Redacted typed JSON source
      description: Paste the candidate Archify JSON or attach it as a file. Keep the topology needed to reproduce the result.
      render: json
    validations:
      required: true

  - type: textarea
    id: artifact
    attributes:
      label: Artifact
      description: Drag in a screenshot and, when practical, attach or link the self-contained HTML, PNG, or WebM.
    validations:
      required: true

  - type: textarea
    id: validation_receipt
    attributes:
      label: Validation receipt
      description: Paste the complete JSON from `archify validate ... --quality showcase --json` or `archify deliver ... --json`.
      render: json
    validations:
      required: true

  - type: dropdown
    id: visual_review
    attributes:
      label: Final artifact visual review
      description: Inspect the final browser artifact or raster, not only the source JSON.
      options:
        - Passed — no visible defects found
        - Failed — defects remain and are described below
        - Skipped — no capable reviewer or image reader was available
    validations:
      required: true

  - type: textarea
    id: visual_notes
    attributes:
      label: Visual review notes
      description: Record clipping, overlaps, hidden routes, weak hierarchy, whitespace, or contrast findings.

  - type: checkboxes
    id: sensitive_data
    attributes:
      label: Sensitive-data check
      options:
        - label: I removed access tokens, credentials, private repository contents, and personal or customer data.
          required: true

  - type: checkboxes
    id: sharing_rights
    attributes:
      label: Sharing rights
      options:
        - label: I created this submission or otherwise have the right to share every attached source and artifact publicly.
          required: true

  - type: checkboxes
    id: public_permission
    attributes:
      label: Permission to feature
      options:
        - label: I allow Archify maintainers to reproduce and feature this submission in the repository, documentation, gallery, and project website under the repository license, with attribution to my GitHub account.
          required: true
