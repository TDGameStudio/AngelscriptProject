[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "angelscript-codegen"
version = "0.1.0"
description = "Deterministic AngelScript test-source generator"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.28"]
web = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]

[project.scripts]
angelscript-codegen = "angelscript_codegen.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/angelscript_codegen"]

[tool.hatch.build]
include = [
  "src/angelscript_codegen/profiles/data/*.json",
  "src/angelscript_codegen/web/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
